<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200px" height="660px" viewBox="0 0 1200 660" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>builder-layout-ai-first</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" font-family="Arial, Helvetica, sans-serif">
        <rect fill="#FFFFFF" x="0" y="0" width="1200" height="660"></rect>
        <rect fill="#F2F4F7" stroke="#D0D5DD" stroke-width="2" x="20" y="20" width="1160" height="620" rx="14"></rect>

        <!-- page toolbar: back on the left, save and the rest on the right -->
        <text fill="#7F56D9" font-size="18"><tspan x="46" y="62">←</tspan></text>
        <rect fill="#E4E7EC" x="1020" y="44" width="58" height="26" rx="6"></rect>
        <text fill="#98A2B3" font-size="12" text-anchor="middle"><tspan x="1049" y="61">Saved</tspan></text>
        <text fill="#667085" font-size="18"><tspan x="1104" y="63">⋮</tspan></text>
        <text fill="#98A2B3" font-size="12"><tspan x="76" y="62">Back</tspan></text>

        <!-- canvas island: toolbar and preview in one card -->
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" x="34" y="88" width="700" height="482" rx="12"></rect>
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5" x="52" y="102" width="24" height="24" rx="5"></rect>
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5" x="84" y="102" width="24" height="24" rx="5"></rect>
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.5" x="116" y="102" width="24" height="24" rx="5"></rect>
        <rect fill="#F4EBFF" stroke="#7F56D9" stroke-width="1.5" x="148" y="102" width="24" height="24" rx="5"></rect>
        <text fill="#667085" font-size="12"><tspan x="186" y="119">Edit · Elements · Preview · Debug</tspan></text>
        <circle fill="#E4E7EC" cx="566" cy="114" r="10"></circle>
        <text fill="#667085" font-size="12"><tspan x="594" y="119">100%</tspan></text>
        <circle fill="#E4E7EC" cx="662" cy="114" r="10"></circle>
        <circle fill="#E4E7EC" cx="692" cy="114" r="10"></circle>
        <line x1="34" y1="140" x2="734" y2="140" stroke="#E4E7EC" stroke-width="1.5"></line>
        <rect fill="#F2F4F7" x="46" y="152" width="676" height="406" rx="8"></rect>
        <rect fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5" x="300" y="176" width="396" height="72" rx="8"></rect>
        <text fill="#182230" font-size="16" font-weight="bold"><tspan x="322" y="220">New form</tspan></text>
        <text fill="#667085" font-size="14" text-anchor="middle"><tspan x="498" y="420">Form preview</tspan></text>

        <!-- element tree: a drawer over the preview, opened on demand -->
        <rect fill="#FFFFFF" stroke="#7F56D9" stroke-width="2" stroke-dasharray="7,5" x="62" y="168" width="208" height="374" rx="10"></rect>
        <text fill="#7F56D9" font-size="13" font-weight="bold" text-anchor="middle"><tspan x="166" y="340">Element tree</tspan></text>
        <text fill="#7F56D9" font-size="12" text-anchor="middle"><tspan x="166" y="360">opens over the preview</tspan></text>

        <!-- debug panel, collapsed by default -->
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" x="34" y="582" width="700" height="44" rx="10"></rect>
        <text fill="#667085" font-size="12"><tspan x="54" y="600">Questionnaire · Response · Population · Extraction · Expressions</tspan></text>
        <text fill="#98A2B3" font-size="11"><tspan x="54" y="617">Debug panel — collapsed by default</tspan></text>

        <!-- chat column -->
        <rect fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2" x="746" y="88" width="420" height="538" rx="12"></rect>
        <text fill="#182230" font-size="15" font-weight="bold"><tspan x="768" y="120">AI Assistant</tspan></text>
        <circle fill="#E4E7EC" cx="1110" cy="114" r="10"></circle>
        <circle fill="#E4E7EC" cx="1140" cy="114" r="10"></circle>
        <line x1="746" y1="140" x2="1166" y2="140" stroke="#E4E7EC" stroke-width="1.5"></line>

        <!-- a panel shares the column, above the conversation -->
        <rect fill="#FCFAFF" stroke="#7F56D9" stroke-width="2" stroke-dasharray="7,5" x="760" y="154" width="392" height="192" rx="10"></rect>
        <text fill="#7F56D9" font-size="13" font-weight="bold" text-anchor="middle"><tspan x="956" y="238">Item settings · theme editor · templates</tspan></text>
        <text fill="#7F56D9" font-size="12" text-anchor="middle"><tspan x="956" y="258">open here, above the conversation</tspan></text>
        <line x1="840" y1="360" x2="1072" y2="360" stroke="#D0D5DD" stroke-width="3" stroke-linecap="round"></line>

        <rect fill="#F9FAFB" x="776" y="384" width="236" height="40" rx="10"></rect>
        <rect fill="#F4EBFF" x="900" y="436" width="252" height="40" rx="10"></rect>
        <text fill="#98A2B3" font-size="13" text-anchor="middle"><tspan x="956" y="508">Conversation</tspan></text>

        <!-- composer -->
        <rect fill="#F9FAFB" stroke="#E4E7EC" stroke-width="1.5" x="760" y="524" width="392" height="86" rx="12"></rect>
        <text fill="#98A2B3" font-size="13"><tspan x="780" y="556">Type your message here…</tspan></text>
        <circle fill="#E4E7EC" cx="782" cy="588" r="10"></circle>
        <circle fill="#7F56D9" cx="1128" cy="588" r="12"></circle>
        <text fill="#FFFFFF" font-size="12" text-anchor="middle"><tspan x="1128" y="592">↑</tspan></text>
    </g>
</svg>
